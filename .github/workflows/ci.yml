name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm test
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - run: npm run build
      - run: npm run build:demo
